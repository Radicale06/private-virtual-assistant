# =============================================================================
# PVA / Musaed  full stack: postgres, redis, backend API, Celery worker & beat,
# frontend. `docker compose up --build`.
#
# Host-published ports are bound to 127.0.0.1 and use a project-specific range
# (13000/15432/16379/18000/18080) so they don't collide with other services on
# the VPS and aren't exposed to the public internet — host-nginx reaches them on
# localhost and reverse-proxies HTTPS. Container-internal ports are unchanged, so
# service-to-service traffic (postgres:5432, redis:6379) and DATABASE_URL/
# REDIS_URL stay the same.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pva}
      POSTGRES_DB: ${POSTGRES_DB:-pva}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pva} -d ${POSTGRES_DB:-pva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lightweight DB UI for inspecting Postgres. Localhost-only; reach it via an
  # SSH tunnel:  ssh -L 18080:127.0.0.1:18080 user@server  → http://localhost:18080
  # Login: System=PostgreSQL, Server=postgres, User/Password/DB from .env.
  adminer:
    image: adminer:4
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./backend:/app
    # --proxy-headers + --forwarded-allow-ips lets uvicorn trust nginx's
    # X-Forwarded-Proto/Host (correct https URLs + Twilio signature validation).
    command: >
      sh -c "prisma db push --skip-generate &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --reload"

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info

  beat:
    build: ./backend
    env_file: .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18000}
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
