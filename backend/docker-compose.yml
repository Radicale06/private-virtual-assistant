# =============================================================================
# Musaed — backend stack: postgres, redis, adminer, API, Celery worker & beat.
#
# Run from the repo root with ./start-all.sh, or directly:
#   docker compose -f backend/docker-compose.yml up -d --build
#
# Env is read from backend/.env (see env_file). Relative paths resolve against
# this file's directory, so `.` = backend/. Host ports bind to 127.0.0.1 on a
# project-specific range so host-nginx proxies them without public exposure or
# collisions. Container-internal ports are unchanged (postgres:5432, redis:6379).
# =============================================================================
name: musaed-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pva}
      POSTGRES_DB: ${POSTGRES_DB:-pva}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pva} -d ${POSTGRES_DB:-pva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Localhost-only DB UI. Reach via SSH tunnel:
  #   ssh -L 18080:127.0.0.1:18080 user@server  → http://localhost:18080
  adminer:
    image: adminer:4
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

  backend:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - .:/app
    # --proxy-headers lets uvicorn trust nginx's X-Forwarded-Proto/Host
    # (correct https URLs + Twilio webhook signature validation).
    command: >
      sh -c "prisma db push --skip-generate &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --reload"

  worker:
    build: .
    env_file: .env
    depends_on:
      - backend
      - redis
    volumes:
      - .:/app
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info

  beat:
    build: .
    env_file: .env
    depends_on:
      - backend
      - redis
    volumes:
      - .:/app
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info

volumes:
  pgdata:
